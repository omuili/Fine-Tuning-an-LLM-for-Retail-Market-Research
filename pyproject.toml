[project]
name = "sba-928-olanrewaju-muili"
version = "0.1.0"
description = "Market research with LLMs: fine-tuning flan-t5-small on the UCI Online Retail dataset, with model comparison and bias assessment"
readme = "README.md"
authors = [
    { name = "Olanrewaju Muili", email = "olanrewaju.muili@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "sentencepiece>=0.2.2",
    "torch>=2.8.0",
    "transformers>=4.57.6",
]

[project.scripts]
sba-928-olanrewaju-muili = "sba_928_olanrewaju_muili:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
